<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Quản lý phòng</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    margin-bottom:25px;
}

.form-box{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:30px;
}

input,
textarea,
button{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    background:#111;
    color:#fff;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#333;
}

button.delete{
    background:#d32f2f;
}

button.delete:hover{
    background:#b71c1c;
}

.preview{
    width:180px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
    display:none;
    margin:5px 0 15px;
}

.room-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.room{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.room img{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
}

.room-info{
    padding:18px;
}

.room-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.desc{
    color:#666;
    line-height:1.5;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    background:#fff3cd;
    color:#856404;
    border-radius:6px;
    font-size:13px;
    margin-bottom:10px;
}

.empty{
    background:#fff;
    padding:30px;
    border-radius:12px;
    color:#777;
}

.status{
    margin-top:10px;
    font-weight:bold;
}

@media(max-width:800px){
    .room-list{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:550px){
    body{
        padding:15px;
    }

    .room-list{
        grid-template-columns:1fr;
    }
}
    /* =========================================
   MENU NGANG KIỂU GITHUB
========================================= */

.admin-tabs{
    display:flex;
    align-items:center;
    gap:4px;
    width:100%;
    overflow-x:auto;
    border-bottom:1px solid #d0d7de;
    margin-bottom:25px;
}

.admin-tabs::-webkit-scrollbar{
    display:none;
}

.admin-tab{
    flex:0 0 auto;
    width:auto;
    margin:0;
    padding:12px 16px;
    border:none;
    border-bottom:2px solid transparent;
    border-radius:0;
    background:transparent;
    color:#57606a;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
}

.admin-tab:hover{
    background:#f6f8fa;
    color:#24292f;
}

.admin-tab.active{
    background:transparent;
    color:#24292f;
    border-bottom:2px solid #fd8c73;
}

.admin-panel{
    display:none;
}

.admin-panel.active{
    display:block;
}
</style>
</head>

<body>

<div class="container">

  <h1>🏨 Quản trị Homestay</h1>


<!-- =========================================
     MENU TAB
========================================= -->

    <button

    <button

    </button>

    <button
        class="admin-tab"

</div>


<!-- =========================================

========================================= -->

<div

        <h2>➕ Thêm phòng</h2>

        <input

        <input

        <input

        <input
            id="wifiPassword"

        <input

</div>


<!-- =========================================

</div>


<!-- =========================================

<div

<!-- =========================================
     TAB 4 - ẢNH PHÒNG
========================================= -->

<div
    id="imagesTab"
    class="admin-panel">

    <h2>🖼️ Quản lý ảnh phòng</h2>

    <div class="form-box">

        <p style="color:#666;">
            Khu vực quản lý ảnh phòng sẽ được thêm

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    setDoc,
    deleteDoc,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyAFVKET2EUkUK_WVR2Zqo7ENWC-h01DWnA",
    authDomain: "homestay-booking-b9846.firebaseapp.com",
    projectId: "homestay-booking-b9846",
    storageBucket: "homestay-booking-b9846.firebasestorage.app",
    messagingSenderId: "962997039665",
    appId: "1:962997039665:web:b11c6aad8cb32f90181b10",
    measurementId: "G-YR15379635"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================
   CLOUDINARY
========================================= */

const CLOUDINARY_CLOUD_NAME = "gzyuigtx";
const CLOUDINARY_UPLOAD_PRESET = "homestay_upload";

/* =========================================
   ELEMENTS
========================================= */

const nameInput = document.getElementById("name");
const priceInput = document.getElementById("price");
const guestsInput = document.getElementById("maxGuests");
const roomNumberInput =
    document.getElementById("roomNumber");

const roomPasswordInput =
    document.getElementById("roomPassword");

const wifiNameInput =
    document.getElementById("wifiName");

const wifiPasswordInput =
    document.getElementById("wifiPassword");

const hostPhoneInput =
    document.getElementById("hostPhone");
const descInput = document.getElementById("desc");
const amenitiesInput = document.getElementById("amenities");
const fileInput = document.getElementById("fileImg");
const featuredInput = document.getElementById("featured");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");
const list = document.getElementById("list");


/* =========================================
   PREVIEW ẢNH
========================================= */

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        preview.style.display = "none";
        return;
    }

    if(!file.type.startsWith("image/")){
        alert("File phải là hình ảnh");
        this.value = "";
        return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

});


/* =========================================
   UPLOAD CLOUDINARY
========================================= */

async function uploadImage(file){

    const url =
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

    const formData = new FormData();

    formData.append("file", file);

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );

    const response = await fetch(url, {
        method: "POST",
        body: formData
    });

    if(!response.ok){

        const errorText = await response.text();

        throw new Error(
            "Cloudinary upload lỗi: " + errorText
        );
    }

    const data = await response.json();

    return data.secure_url;
}


/* =========================================
   THÊM PHÒNG
========================================= */

document.getElementById("btnAdd").addEventListener(
    "click",
    async function(){

        try{

            const name =
                nameInput.value.trim();

            const price =
                Number(priceInput.value);

            const maxGuests =
                Number(guestsInput.value);

            const desc =
                descInput.value.trim();

            const amenities =
                amenitiesInput.value.trim();

            const file =
                fileInput.files[0];

            const featured =
                featuredInput.checked;


            /* CHECK */

            if(!name){
                alert("Chưa nhập tên phòng");
                return;
            }

            if(!price || price <= 0){
                alert("Giá phòng không hợp lệ");
                return;
            }

            if(!maxGuests || maxGuests <= 0){
                alert("Chưa nhập số khách");
                return;
            }

            if(!file){
                alert("Chưa chọn ảnh phòng");
                return;
            }


            /* LOCK BUTTON */

            this.disabled = true;

            this.innerText =
                "⏳ Đang upload ảnh...";

            statusBox.innerText =
                "Đang tải ảnh lên Cloudinary...";


            /* UPLOAD */

            const imageUrl =
                await uploadImage(file);


            statusBox.innerText =
                "Ảnh đã upload. Đang lưu phòng...";


            /* AMENITIES */

            const amenitiesArray =
                amenities
                    .split(",")
                    .map(item => item.trim())
                    .filter(item => item);


            /* FIRESTORE */

            await addDoc(
                collection(db, "rooms"),
                {
                    name: name,

                    price: price,

                    maxGuests: maxGuests,

                    description: desc,
                roomNumber: roomNumberInput.value.trim(),
roomPassword: roomPasswordInput.value.trim(),
wifiName: wifiNameInput.value.trim(),
wifiPassword: wifiPasswordInput.value.trim(),
hostPhone: hostPhoneInput.value.trim(),
                    amenities: amenitiesArray,

                    image: imageUrl,

                    featured: featured,

                    active: true,

                    createdAt:
                        serverTimestamp()
                }
            );


            /* SUCCESS */

            statusBox.innerText =
                "✅ Thêm phòng thành công";


            alert("✅ Đã thêm phòng");


               /* RESET */

nameInput.value = "";
priceInput.value = "";
guestsInput.value = "";

roomNumberInput.value = "";
roomPasswordInput.value = "";
wifiNameInput.value = "";
wifiPasswordInput.value = "";
hostPhoneInput.value = "";

descInput.value = "";
amenitiesInput.value = "";
fileInput.value = "";
featuredInput.checked = false;

preview.src = "";
preview.style.display = "none";

            await loadRooms();


        }
        catch(error){

            console.error(error);

            statusBox.innerText =
                "❌ Có lỗi xảy ra";

            alert(
                "Lỗi: " + error.message
            );

        }
        finally{

            this.disabled = false;

            this.innerText =
                "➕ Thêm phòng";

        }

    }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================
   XÓA PHÒNG
========================================= */

window.deleteRoom = async function(id){

    const ok =
        confirm("Bạn có chắc muốn xoá phòng này?");

    if(!ok) return;

    try{

        await deleteDoc(
            doc(db, "rooms", id)
        );

        alert("✅ Đã xoá phòng");

        await loadRooms();

    }
    catch(error){

        alert(
            "Không thể xoá: " +
            error.message
        );

    }

};


/* =========================================
   LOAD PHÒNG
========================================= */

async function loadRooms(){

    list.innerHTML =
        "<p>⏳ Đang tải phòng...</p>";

    try{

        const snapshot =
            await getDocs(
                collection(db, "rooms")
            );

        if(snapshot.empty){

            list.innerHTML =
                `<div class="empty">
                    Chưa có phòng nào.
                </div>`;

            return;
        }


        const rooms = [];

        snapshot.forEach(item => {

            rooms.push({
                id: item.id,
                ...item.data()
            });

        });


        /* MỚI NHẤT LÊN TRƯỚC */

        rooms.reverse();


        list.innerHTML =
            rooms.map(room => {

                const amenities =
                    Array.isArray(room.amenities)
                        ? room.amenities.join(", ")
                        : "";


                return `

                    <div class="room">

                        <img
                            src="${escapeHtml(room.image)}"
                            alt="${escapeHtml(room.name)}"
                            onerror="this.style.display='none'">

                        <div class="room-info">

                            ${
                                room.featured
                                ? `<div class="badge">
                                      ⭐ Nổi bật
                                   </div>`
                                : ""
                            }

                            <div class="room-name">
                                ${escapeHtml(room.name)}
                            </div>

                            <div class="price">
                                ${Number(room.price || 0)
                                    .toLocaleString("vi-VN")}đ
                                / đêm
                            </div>

                            <div>
                                👥 Tối đa
                                ${Number(room.maxGuests || 0)}
                                khách
                            </div>

                            <div class="desc">
                                ${escapeHtml(room.description)}
                            </div>

                            ${
                                amenities
                                ? `<div class="desc">
                                      🛏️ ${escapeHtml(amenities)}
                                   </div>`
                                : ""
                            }

                            <button
                                class="delete"
                                onclick="deleteRoom('${room.id}')">
                                🗑️ Xoá phòng
                            </button>

                        </div>

                    </div>

                `;

            }).join("");

    }
    catch(error){

        console.error(error);

        list.innerHTML =
            `<div class="empty">
                ❌ Không thể tải danh sách phòng:
                ${escapeHtml(error.message)}
             </div>`;

    }

}

/* =========================================
   BOOKING MANAGEMENT
========================================= */

const bookingList =
    document.getElementById("bookingList");
const revenueSummary =
    document.getElementById("revenueSummary");

const revenueList =
    document.getElementById("revenueList");
const syncRevenueButton =
    document.getElementById("syncRevenueButton");


syncRevenueButton.addEventListener(
    "click",
    syncOldRevenues
);


async function syncOldRevenues(){

    const ok = confirm(
        "Đồng bộ tất cả đơn đã thanh toán vào doanh thu?"
    );

    if(!ok) return;


    syncRevenueButton.disabled = true;

    syncRevenueButton.innerText =
        "⏳ Đang đồng bộ...";


    try{

        const snapshot =
            await getDocs(
                collection(db,"bookings")
            );


        let count = 0;


        for(const item of snapshot.docs){

            const booking =
                item.data();


            /*
             * CHỈ LẤY ĐƠN ĐÃ THANH TOÁN
             */

            if(
                booking.paymentStatus !== "paid" ||
                booking.bookingStatus !== "confirmed"
            ){

                continue;
            }


            /*
             * TẠO DOANH THU
             */

            await setDoc(
                doc(
                    db,
                    "revenues",
                    item.id
                ),
                {
                    ...booking,

                    paymentStatus: "paid",

                    bookingStatus: "confirmed",

                    revenueStatus: "active",

                    revenueCreatedAt:
                        serverTimestamp(),

                    syncedFromBooking: true

                },
                {
                    merge: true
                }
            );


            count++;

        }


        alert(
            `✅ Đã đồng bộ ${count} đơn vào doanh thu`
        );


        await loadRevenues();


    }
    catch(error){

        console.error(error);

        alert(
            "❌ Đồng bộ thất bại: " +
            error.message
        );

    }
    finally{

        syncRevenueButton.disabled = false;

        syncRevenueButton.innerText =
            "🔄 Đồng bộ đơn đã thanh toán";

    }

}
async function loadBookings(){

    bookingList.innerHTML =
        "⏳ Đang tải đơn đặt phòng...";


    try{

        const snapshot =
            await getDocs(
                collection(db,"bookings")
            );


        if(snapshot.empty){

            bookingList.innerHTML =
                `
                <div class="empty">
                    Chưa có đơn đặt phòng.
                </div>
                `;

            return;

        }


        const bookings = [];


        snapshot.forEach(item => {

            bookings.push({

                id:item.id,

                ...item.data()

            });

        });


        bookings.reverse();


        bookingList.innerHTML =
            bookings.map(booking => {

                const paid =
                    booking.paymentStatus === "paid";


                return `

                <div style="
                    background:#fff;
                    padding:20px;
                    border-radius:15px;
                    box-shadow:0 3px 12px rgba(0,0,0,.08);
                ">

                    <h3 style="margin-top:0;">
                        ${escapeHtml(
                            booking.bookingCode || ""
                        )}
                    </h3>


                    <div>
                        🏠
                        ${escapeHtml(
                            booking.roomName || ""
                        )}
                    </div>


                    <div>
                        👤
                        ${escapeHtml(
                            booking.customerName || ""
                        )}
                    </div>


                    <div>
                        📞
                        ${escapeHtml(
                            booking.phone || ""
                        )}
                    </div>


                    <div>
                        📅
                        ${escapeHtml(
                            booking.checkIn || ""
                        )}
                        →
                        ${escapeHtml(
                            booking.checkOut || ""
                        )}
                    </div>


                    <div>
                        🌙
                        ${Number(
                            booking.nights || 0
                        )}
                        đêm
                    </div>


                    <div style="
                        font-size:20px;
                        font-weight:bold;
                        margin:10px 0;
                    ">

                        💰
                        ${Number(
                            booking.total || 0
                        ).toLocaleString("vi-VN")}đ

                    </div>


                    <div style="
                        margin:10px 0;
                        font-weight:bold;
                    ">

                        ${
                            paid
                            ? "✅ Đã thanh toán"
                            : "⏳ Chờ thanh toán"
                        }

                    </div>


                   ${
    paid
    ? `
        <div style="
            padding:12px;
            background:#d1e7dd;
            color:#0f5132;
            border-radius:8px;
        ">
            Đã xác nhận.
        </div>
    `
    :
    `
        <button
            onclick="confirmPayment('${booking.id}')"
        >
            💳 Xác nhận đã thanh toán
        </button>

        <button
            class="delete"
            onclick="deleteBooking('${booking.id}')"
        >
            🗑️ Xóa đơn chờ thanh toán
        </button>
    `
}

                </div>

                `;

            }).join("");

    }
    catch(error){

        bookingList.innerHTML =
            `
            <div class="empty">
                ❌ ${escapeHtml(error.message)}
            </div>
            `;

    }

}
/* =========================================
   QUẢN LÝ DOANH THU
========================================= */

async function loadRevenues(){

    revenueSummary.innerHTML =
        "⏳ Đang tính doanh thu...";

    revenueList.innerHTML =
        "⏳ Đang tải lịch sử doanh thu...";

    try{

        const snapshot =
            await getDocs(
                collection(db,"revenues")
            );

        if(snapshot.empty){

            revenueSummary.innerHTML = `
                <div style="
                    background:#fff;
                    padding:20px;
                    border-radius:15px;
                    font-weight:bold;
                ">
                    💰 Tổng doanh thu<br>
                    0đ
                </div>

                <div style="
                    background:#fff;
                    padding:20px;
                    border-radius:15px;
                    font-weight:bold;
                ">
                    📋 Số đơn<br>
                    0
                </div>

                <div style="
                    background:#fff;
                    padding:20px;
                    border-radius:15px;
                    font-weight:bold;
                ">
                    🏨 Đơn hoàn tất<br>
                    0
                </div>
            `;

            revenueList.innerHTML = `
                <div class="empty">
                    Chưa có đơn hoàn tất.
                </div>
            `;

            return;
        }


        const revenues = [];

        let totalRevenue = 0;


        snapshot.forEach(item => {

            const data = item.data();

            revenues.push({
                id:item.id,
                ...data
            });

            totalRevenue +=
                Number(data.total || 0);

        });


        revenues.reverse();


        revenueSummary.innerHTML = `

            <div style="
                background:#fff;
                padding:20px;
                border-radius:15px;
                box-shadow:0 3px 12px rgba(0,0,0,.08);
            ">
                <div style="
                    color:#666;
                    margin-bottom:8px;
                ">
                    💰 Tổng doanh thu
                </div>

                <div style="
                    font-size:24px;
                    font-weight:bold;
                ">
                    ${totalRevenue.toLocaleString("vi-VN")}đ
                </div>
            </div>


            <div style="
                background:#fff;
                padding:20px;
                border-radius:15px;
                box-shadow:0 3px 12px rgba(0,0,0,.08);
            ">
                <div style="
                    color:#666;
                    margin-bottom:8px;
                ">
                    📋 Tổng đơn
                </div>

                <div style="
                    font-size:24px;
                    font-weight:bold;
                ">
                    ${revenues.length}
                </div>
            </div>


            <div style="
                background:#fff;
                padding:20px;
                border-radius:15px;
                box-shadow:0 3px 12px rgba(0,0,0,.08);
            ">
                <div style="
                    color:#666;
                    margin-bottom:8px;
                ">
                    🏨 Đơn hoàn tất
                </div>

                <div style="
                    font-size:24px;
                    font-weight:bold;
                ">
                    ${revenues.length}
                </div>
            </div>

        `;


        revenueList.innerHTML =
            revenues.map(revenue => {

                return `

                <div style="
                    background:#fff;
                    padding:20px;
                    border-radius:15px;
                    box-shadow:0 3px 12px rgba(0,0,0,.08);
                ">

                    <h3 style="margin-top:0;">
                        ${escapeHtml(
                            revenue.bookingCode || ""
                        )}
                    </h3>

                    <div>
                        🏠
                        ${escapeHtml(
                            revenue.roomName || ""
                        )}
                    </div>

                    <div>
                        👤
                        ${escapeHtml(
                            revenue.customerName || ""
                        )}
                    </div>

                    <div>
                        📞
                        ${escapeHtml(
                            revenue.phone || ""
                        )}
                    </div>

                    <div>
                        📅
                        ${escapeHtml(
                            revenue.checkIn || ""
                        )}
                        →
                        ${escapeHtml(
                            revenue.checkOut || ""
                        )}
                    </div>

                    <div>
                        🌙
                        ${Number(
                            revenue.nights || 0
                        )}
                        đêm
                    </div>

                    <div style="
                        font-size:20px;
                        font-weight:bold;
                        margin-top:10px;
                    ">
                        💰
                        ${Number(
                            revenue.total || 0
                        ).toLocaleString("vi-VN")}đ
                    </div>

                    <div style="
                        margin-top:10px;
                        padding:10px;
                        background:#d1e7dd;
                        color:#0f5132;
                        border-radius:8px;
                    ">
                        ✅ Đã hoàn tất
                    </div>

                </div>

                `;

            }).join("");

    }
    catch(error){

        revenueSummary.innerHTML = `
            <div class="empty">
                ❌ Không thể tải doanh thu:
                ${escapeHtml(error.message)}
            </div>
        `;

        revenueList.innerHTML = "";

    }

}

window.confirmPayment = async function(bookingId){

    const ok = confirm(
        "Xác nhận đã nhận được tiền cho đơn này?"
    );

    if(!ok) return;

    try{

        /* ================================
           1. LẤY BOOKING
        ================================= */

        const bookingRef =
            doc(db, "bookings", bookingId);

        const bookingSnap =
            await getDoc(bookingRef);

        if(!bookingSnap.exists()){
            throw new Error("Không tìm thấy đơn đặt phòng");
        }

        const booking =
            bookingSnap.data();


        /* ================================
           2. CẬP NHẬT BOOKING
        ================================= */

        await updateDoc(
            bookingRef,
            {
                paymentStatus: "paid",
                bookingStatus: "confirmed",
                paidAt: serverTimestamp(),
                confirmedAt: serverTimestamp()
            }
        );


        /* ================================
           3. TẠO DOANH THU
        ================================= */

        await setDoc(
            doc(db, "revenues", bookingId),
            {
                ...booking,

                paymentStatus: "paid",

                bookingStatus: "confirmed",

                revenueStatus: "active",

                revenueCreatedAt:
                    serverTimestamp()
            }
        );


        /* ================================
           4. TẢI LẠI
        ================================= */

        alert(
            "✅ Đã xác nhận thanh toán và ghi nhận doanh thu"
        );

        await loadBookings();
        await loadRevenues();

    }
    catch(error){

        console.error(error);

        alert(
            "❌ Lỗi: " +
            error.message
        );

    }

};
    /* =========================================
   XÓA ĐƠN ĐẶT PHÒNG
========================================= */

window.deleteBooking = async function(bookingId){

    const ok = confirm(
        "Bạn có chắc muốn xóa đơn đặt phòng này?"
    );

    if(!ok) return;

    try{

        await deleteDoc(
            doc(
                db,
                "bookings",
                bookingId
            )
        );

        alert("✅ Đã xóa đơn đặt phòng");

        await loadBookings();

    }
    catch(error){

        alert(
            "❌ Không thể xóa đơn: " +
            error.message
        );

    }

};

const adminTabs =
    document.querySelectorAll(".admin-tab");

const adminPanels =
    document.querySelectorAll(".admin-panel");


adminTabs.forEach(tab => {

    tab.addEventListener("click", function(){

        const targetId =
            this.dataset.tab;


        adminTabs.forEach(item => {
            item.classList.remove("active");
        });


        adminPanels.forEach(panel => {
            panel.classList.remove("active");
        });


        this.classList.add("active");


        const target =
            document.getElementById(targetId);

        if(target){
            target.classList.add("active");
        }

    });

});
