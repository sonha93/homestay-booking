
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Quản lý Homestay</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    margin:0 0 25px;
}

h2{
    margin-top:0;
}

.form-box{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:25px;
}

input,
textarea,
select,
button{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    background:#111;
    color:#fff;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#333;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

button.delete{
    background:#d32f2f;
}

button.delete:hover{
    background:#b71c1c;
}

button.secondary{
    background:#6c757d;
}

button.success{
    background:#198754;
}

button.warning{
    background:#f0ad00;
    color:#111;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

.preview{
    width:180px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
    display:none;
    margin:5px 0 15px;
}

.status{
    margin-top:8px;
    font-weight:bold;
}

.empty{
    background:#fff;
    padding:30px;
    border-radius:12px;
    color:#777;
}

.admin-tabs{
    display:flex;
    align-items:center;
    gap:4px;
    width:100%;
    overflow-x:auto;
    border-bottom:1px solid #d0d7de;
    margin-bottom:25px;
}

.admin-tabs::-webkit-scrollbar{
    display:none;
}

.admin-tab{
    flex:0 0 auto;
    width:auto;
    margin:0;
    padding:12px 16px;
    border:none;
    border-bottom:2px solid transparent;
    border-radius:0;
    background:transparent;
    color:#57606a;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
}

.admin-tab:hover{
    background:#f6f8fa;
    color:#24292f;
}

.admin-tab.active{
    background:transparent;
    color:#24292f;
    border-bottom:2px solid #fd8c73;
}

.admin-panel{
    display:none;
}

.admin-panel.active{
    display:block;
}

/* ================================
   ROOM
================================ */

.room-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.room{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.room img{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
}

.room-info{
    padding:18px;
}

.room-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.desc{
    color:#666;
    line-height:1.5;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    background:#fff3cd;
    color:#856404;
    border-radius:6px;
    font-size:13px;
    margin-bottom:10px;
}

/* ================================
   BOOKING
================================ */

.booking-card,
.revenue-card{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.booking-card{
    margin-bottom:15px;
}

.card-code{
    font-size:19px;
    font-weight:bold;
    margin-bottom:12px;
}

.money{
    font-size:20px;
    font-weight:bold;
    margin:12px 0;
}

.status-paid{
    padding:12px;
    background:#d1e7dd;
    color:#0f5132;
    border-radius:8px;
    font-weight:bold;
}

.status-pending{
    padding:12px;
    background:#fff3cd;
    color:#856404;
    border-radius:8px;
    font-weight:bold;
}

/* ================================
   REVENUE
================================ */

.revenue-filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.revenue-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.summary-title{
    color:#666;
    margin-bottom:8px;
}

.summary-value{
    font-size:24px;
    font-weight:bold;
}

/* ================================
   IMAGE
================================ */

.preview-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.photo{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.photo.is-cover{
    outline:3px solid #198754;
}

.photo img{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
}

.photo-info{
    padding:12px;
}

.photo-id{
    font-size:12px;
    color:#777;
    word-break:break-all;
    margin-bottom:8px;
}

.cover-badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    background:#d1e7dd;
    color:#0f5132;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

/* ================================
   LIGHTBOX
================================ */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:9999;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.lightbox.show{
    display:flex;
}

.zoom-area{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.zoom-image{
    max-width:90%;
    max-height:85%;
    object-fit:contain;
    cursor:grab;
    transform-origin:center center;
    user-select:none;
}

.zoom-image.dragging{
    cursor:grabbing;
}

.close{
    position:absolute;
    top:20px;
    right:25px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    font-size:25px;
    padding:0;
    z-index:3;
}

.zoom-controls{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:3;
}

.zoom-controls button{
    width:50px;
    height:45px;
    margin:0;
    padding:0;
    font-size:22px;
    background:#fff;
    color:#111;
}

.zoom-percent{
    width:auto !important;
    min-width:70px;
    font-size:14px !important;
}

/* ================================
   MOBILE
================================ */

@media(max-width:900px){

    .room-list{
        grid-template-columns:repeat(2,1fr);
    }

    .preview-list{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:600px){

    body{
        padding:15px;
    }

    .room-list{
        grid-template-columns:1fr;
    }

    .preview-list{
        grid-template-columns:repeat(2,1fr);
    }

    .photo img{
        height:160px;
    }

    .revenue-summary{
        grid-template-columns:1fr;
    }

    .revenue-filter{
        grid-template-columns:1fr;
    }

}
</style>
</head>

/* =========================================

/* =========================================

priceInput.addEventListener("input", function(){

    let value = this.value.replace(/\D/g, "");

    if(value){
        this.value = Number(value).toLocaleString("vi-VN");
    }

});
/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   FORMAT MONEY
========================================= */

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString("vi-VN") + "đ";

}

function parseMoney(value){

    return Number(
        String(value || "")
            .replace(/\./g,"")
            .replace(/,/g,"")
            .replace(/[^\d]/g,"")
    );

}
    function formatMoneyInput(input){

    input.addEventListener(
        "input",
        function(){

            const number =
                parseMoney(this.value);

            if(!number){
                this.value = "";
                return;
            }

            this.value =
                number.toLocaleString("vi-VN");

        }
    );

}

formatMoneyInput(hourlyPriceInput);

formatMoneyInput(priceInput);
/* =========================================
   PREVIEW ẢNH PHÒNG
========================================= */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            preview.style.display =
                "none";

            preview.src = "";

            return;

        }


        if(!file.type.startsWith("image/")){

            alert(
                "File phải là hình ảnh"
            );

            this.value = "";

            return;

        }


        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    }
);


/* =========================================
   CLOUDINARY UPLOAD
========================================= */

async function uploadToCloudinary(file){

    const uploadUrl =
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            uploadUrl,
            {
                method:"POST",
                body:formData
            }
        );


    if(!response.ok){

        const errorText =
            await response.text();

        throw new Error(
            "Cloudinary upload lỗi: " +
            errorText
        );

    }


    return await response.json();

}


/* =========================================
   THÊM PHÒNG
========================================= */

document
.getElementById("btnAdd")
.addEventListener(
    "click",
    async function(){

        const button =
            this;

        try{

            const name =
                nameInput.value.trim();

          const hourlyPrice =
    parseMoney(
        hourlyPriceInput.value
    );

const hourlyHours =
    Number(
        hourlyHoursInput.value
    );

const dailyPrice =
    parseMoney(
        priceInput.value
    );

const maxGuests =
    Number(
        guestsInput.value
    );
            const roomNumber =
                roomNumberInput.value.trim();

            const roomPassword =
                roomPasswordInput.value.trim();

            const wifiName =
                wifiNameInput.value.trim();

            const wifiPassword =
                wifiPasswordInput.value.trim();

            const hostPhone =
                hostPhoneInput.value.trim();

            const description =
                descInput.value.trim();

            const amenitiesText =
                amenitiesInput.value.trim();

            const featured =
                featuredInput.checked;

            const file =
                fileInput.files[0];


            if(!name){

                alert(
                    "Chưa nhập tên phòng"
                );

                return;

            }


               if(!hourlyPrice || hourlyPrice <= 0){

    alert(
        "Giá thuê theo giờ không hợp lệ"
    );

    return;
}

if(!hourlyHours || hourlyHours <= 0){

    alert(
        "Số giờ combo không hợp lệ"
    );

    return;
}

if(!dailyPrice || dailyPrice <= 0){

    alert(
        "Giá thuê theo ngày không hợp lệ"
    );

    return;
}

            if(!maxGuests || maxGuests <= 0){

                alert(
                    "Chưa nhập số khách"
                );

                return;

            }


            if(!file){

                alert(
                    "Chưa chọn ảnh phòng"
                );

                return;

            }


            button.disabled =
                true;

            button.innerText =
                "⏳ Đang upload ảnh...";

            roomStatus.innerText =
                "Đang tải ảnh lên Cloudinary...";


            const cloudinary =
                await uploadToCloudinary(
                    file
                );


            const amenities =
                amenitiesText
                    .split(",")
                    .map(
                        item =>
                            item.trim()
                    )
                    .filter(Boolean);


            roomStatus.innerText =
                "Ảnh đã upload. Đang lưu phòng...";


            await addDoc(
                collection(
                    db,
                    "rooms"
                ),

/* =========================================
   LOAD ROOMS
========================================= */

async function loadRooms(){

    list.innerHTML =
        "<p>⏳ Đang tải phòng...</p>";

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "rooms"
                )
            );


        if(snapshot.empty){

            list.innerHTML =
                `<div class="empty">
                    Chưa có phòng nào.
                 </div>`;

            return;

        }


        const rooms = [];


        snapshot.forEach(
            item => {

                rooms.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        rooms.reverse();


        list.innerHTML =
            rooms.map(
                room => {

                    const amenities =
                        Array.isArray(
                            room.amenities
                        )
                        ?
                        room.amenities.join(", ")
                        :
                        "";


                    return `

                    <div class="room">

                        <img
                            src="${escapeHtml(room.image)}"
                            alt="${escapeHtml(room.name)}"
                            onerror="this.style.display='none'"
                        >

                        <div class="room-info">

                            ${
                                room.featured
                                ?
                                `
                                <div class="badge">
                                    ⭐ Nổi bật
                                </div>
                                `
                                :
                                ""
                            }

                            <div class="room-name">
                                ${escapeHtml(room.name)}
                            </div>

                            <div class="price">
                                ${formatMoney(room.price)}
                                / đêm
                            </div>

                            <div>
                                👥 Tối đa
                                ${Number(room.maxGuests || 0)}
                                khách
                            </div>

                            ${
                                room.roomNumber
                                ?
                                `
                                <div>
                                    🚪
                                    ${escapeHtml(room.roomNumber)}
                                </div>
                                `
                                :
                                ""
                            }

                            <div class="desc">
                                ${escapeHtml(room.description)}
                            </div>

                            ${
                                amenities
                                ?
                                `
                                <div class="desc">
                                    🛏️
                                    ${escapeHtml(amenities)}
                                </div>
                                `
                                :
                                ""
                            }

                            <button
                                type="button"
                                class="delete"
                                data-room-id="${room.id}">
                                🗑️ Xóa phòng
                            </button>

                        </div>

                    </div>

                    `;

                }
            ).join("");


        list
        .querySelectorAll(
            "[data-room-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(){

                        deleteRoom(
                            this.dataset.roomId
                        );

                    }
                );

            }
        );

    }
    catch(error){

        list.innerHTML =
            `
            <div class="empty">
                ❌ Không thể tải phòng:
                ${escapeHtml(error.message)}
            </div>
            `;

    }

}

/* =========================================
   CONFIRM PAYMENT
========================================= */

async function confirmPayment(
    bookingId
){

    if(
        !confirm(
            "Xác nhận bạn đã nhận được tiền?"
        )
    ){

        return;

    }


    try{

        const bookingRef =
            doc(
                db,
                "bookings",
                bookingId
            );


        const bookingSnap =
            await getDoc(
                bookingRef
            );


        if(!bookingSnap.exists()){

            throw new Error(
                "Không tìm thấy đơn đặt phòng"
            );

        }


        const booking =
            bookingSnap.data();


        await updateDoc(
            bookingRef,
            {

                paymentStatus:
                    "paid",

                bookingStatus:
                    "confirmed",

                paidAt:
                    serverTimestamp(),

                confirmedAt:
                    serverTimestamp()

            }
        );


        await setDoc(
            doc(
                db,
                "revenues",
                bookingId
            ),
            {

                ...booking,

                paymentStatus:
                    "paid",

                bookingStatus:
                    "confirmed",

                revenueStatus:
                    "active",

                revenueCreatedAt:
                    serverTimestamp(),

                syncedFromBooking:
                    true

            }
        );


        alert(
            "✅ Đã xác nhận thanh toán"
        );


        await loadBookings();
        await loadRevenues();

    }
    catch(error){

        alert(
            "❌ Lỗi: " +
            error.message
        );

    }

}

/* =========================================
   SYNC PAID BOOKINGS
========================================= */

async function syncOldRevenues(){

    if(
        !confirm(
            "Đồng bộ tất cả đơn đã thanh toán vào doanh thu?"
        )
    ){

        return;

    }


    const button =
        document.getElementById(
            "syncRevenueButton"
        );


    button.disabled =
        true;

    button.innerText =
        "⏳ Đang đồng bộ...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "bookings"
                )
            );


        let count = 0;


        for(
            const item of snapshot.docs
        ){

            const booking =
                item.data();


            if(
                booking.paymentStatus !== "paid" ||
                booking.bookingStatus !== "confirmed"
            ){

                continue;

            }


            await setDoc(
                doc(
                    db,
                    "revenues",
                    item.id
                ),
                {

                    ...booking,

                    paymentStatus:
                        "paid",

                    bookingStatus:
                        "confirmed",

                    revenueStatus:
                        "active",

                    revenueCreatedAt:
                        serverTimestamp(),

                    syncedFromBooking:
                        true

                },
                {
                    merge:true
                }
            );


            count++;

        }


        alert(
            `✅ Đã đồng bộ ${count} đơn`
        );


        await loadRevenues();

    }
    catch(error){

        alert(
            "❌ Đồng bộ thất bại: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

        button.innerText =
            "🔄 Đồng bộ đơn đã thanh toán";

    }

}


/* =========================================
   HOÀN TẤT ĐƠN ĐÃ CHECKOUT
========================================= */

async function completeFinishedBookings(){

    if(
        !confirm(
            "Chuyển các đơn đã qua ngày checkout sang doanh thu hoàn tất?"
        )
    ){

        return;

    }


    const button =
        document.getElementById(
            "completeBookingsButton"
        );


    button.disabled =
        true;

    button.innerText =
        "⏳ Đang xử lý...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "bookings"
                )
            );


        const today =
            new Date()
                .toISOString()
                .slice(0,10);


        let count = 0;


        for(
            const item of snapshot.docs
        ){

            const booking =
                item.data();


            if(
                booking.paymentStatus !== "paid" ||
                booking.bookingStatus !== "confirmed"
            ){

                continue;

            }


            const checkout =
                String(
                    booking.checkOut || ""
                );


            if(
                !checkout ||
                checkout > today
            ){

                continue;

            }


            await setDoc(
                doc(
                    db,
                    "revenues",
                    item.id
                ),
                {

                    ...booking,

                    paymentStatus:
                        "paid",

                    bookingStatus:
                        "completed",

                    revenueStatus:
                        "completed",

                    completedAt:
                        serverTimestamp(),

                    revenueCreatedAt:
                        serverTimestamp(),

                    syncedFromBooking:
                        true

                },
                {
                    merge:true
                }
            );


            await deleteDoc(
                doc(
                    db,
                    "bookings",
                    item.id
                )
            );


            count++;

        }


        alert(
            `✅ Đã chuyển ${count} đơn sang doanh thu hoàn tất`
        );


        await loadBookings();
        await loadRevenues();

    }
    catch(error){

        alert(
            "❌ Không thể hoàn tất đơn: " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

        button.innerText =
            "✅ Hoàn tất đơn đã checkout";

    }

}


/* =========================================
   LOAD REVENUES
========================================= */

async function loadRevenues(
    fromDate = revenueFromDate.value,
    toDate = revenueToDate.value
){

    revenueSummary.innerHTML =
        "⏳ Đang tính doanh thu...";

    revenueList.innerHTML =
        "⏳ Đang tải doanh thu...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "revenues"
                )
            );


        const revenues = [];


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const revenueDate =
                    String(
                        data.checkOut || ""
                    ).trim();


                if(
                    fromDate &&
                    revenueDate &&
                    revenueDate < fromDate
                ){

                    return;

                }


                if(
                    toDate &&
                    revenueDate &&
                    revenueDate > toDate
                ){

                    return;

                }


                if(
                    (fromDate || toDate) &&
                    !revenueDate
                ){

                    return;

                }


                revenues.push({

                    id:item.id,

                    ...data

                });

            }
        );


        revenues.sort(
            (a,b) =>
                String(
                    b.checkOut || ""
                )
                .localeCompare(
                    String(
                        a.checkOut || ""
                    )
                )
        );


        let totalRevenue = 0;


        revenues.forEach(
            item => {

                totalRevenue +=
                    Number(
                        item.total || 0
                    );

            }
        );


        const completedCount =
            revenues.filter(
                item =>
                    item.bookingStatus ===
                    "completed"
            ).length;


        revenueSummary.innerHTML = `

            <div class="summary-card">

                <div class="summary-title">
                    💰 Tổng doanh thu
                </div>

                <div class="summary-value">
                    ${formatMoney(totalRevenue)}
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-title">
                    📋 Tổng đơn
                </div>

                <div class="summary-value">
                    ${revenues.length}
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-title">
                    🏨 Đơn hoàn tất
                </div>

                <div class="summary-value">
                    ${completedCount}
                </div>

            </div>

        `;


        if(!revenues.length){

            revenueList.innerHTML =
                `
                <div class="empty">

                    ${
                        fromDate || toDate
                        ?
                        "Không có doanh thu trong khoảng ngày đã chọn."
                        :
                        "Chưa có doanh thu."
                    }

                </div>
                `;

            return;

        }


        revenueList.innerHTML =
            revenues.map(
                revenue => {

                    const completed =
                        revenue.bookingStatus ===
                        "completed";


                    return `

                    <div class="revenue-card">

                        <div class="card-code">

                            ${escapeHtml(
                                revenue.bookingCode || ""
                            )}

                        </div>


                        <div>
                            🏠
                            ${escapeHtml(
                                revenue.roomName || ""
                            )}
                        </div>


                        <div>
                            👤
                            ${escapeHtml(
                                revenue.customerName || ""
                            )}
                        </div>


                        <div>
                            📞
                            ${escapeHtml(
                                revenue.phone || ""
                            )}
                        </div>


                        <div>
                            📅
                            ${escapeHtml(
                                revenue.checkIn || ""
                            )}
                            →
                            ${escapeHtml(
                                revenue.checkOut || ""
                            )}
                        </div>


                        <div>
                            🌙
                            ${Number(
                                revenue.nights || 0
                            )}
                            đêm
                        </div>


                        <div class="money">
                            💰
                            ${formatMoney(
                                revenue.total
                            )}
                        </div>


                        <div class="status-paid">

                            ${
                                completed
                                ?
                                "✅ Đã hoàn tất"
                                :
                                "💰 Đã thanh toán — đang hoạt động"
                            }

                        </div>

                    </div>

                    `;

                }
            ).join("");

    }
    catch(error){

        revenueSummary.innerHTML =
            `
            <div class="empty">
                ❌ Không thể tải doanh thu:
                ${escapeHtml(
                    error.message
                )}
            </div>
            `;

        revenueList.innerHTML = "";

    }

}

/* =========================================
   UPLOAD IMAGE
========================================= */

uploadBtn.addEventListener(
    "click",
    async function(){

        const roomId =
            roomSelect.value;


        const files =
            Array.from(
                imageFiles.files
            );


        if(!roomId){

            alert(
                "Hãy chọn phòng trước"
            );

            return;

        }


        if(!files.length){

            alert(
                "Hãy chọn ít nhất một ảnh"
            );

            return;

        }


        uploadBtn.disabled =
            true;


        let success =
            0;


        try{

            for(
                let i = 0;
                i < files.length;
                i++
            ){

                const file =
                    files[i];


                if(
                    !file.type.startsWith(
                        "image/"
                    )
                ){

                    continue;

                }


                imageStatus.innerText =
                    `⏳ Upload ${i + 1}/${files.length}...`;


                const cloudinary =
                    await uploadToCloudinary(
                        file
                    );


                const imageId =
                    "img_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2,8);


                await addDoc(
                    collection(
                        db,
                        "rooms",
                        roomId,
                        "images"
                    ),
                    {

                        imageId,

                        roomId,

                        url:
                            cloudinary.secure_url,

                        publicId:
                            cloudinary.public_id,

                        width:
                            cloudinary.width || null,

                        height:
                            cloudinary.height || null,

                        format:
                            cloudinary.format || null,

                        isCover:false,

                        createdAt:
                            serverTimestamp()

                    }
                );


                success++;

            }


            imageStatus.innerText =
                `✅ Đã upload ${success} ảnh`;


            imageFiles.value =
                "";


            await loadImages(
                roomId
            );

        }
        catch(error){

            console.error(error);

            imageStatus.innerText =
                "❌ Upload ảnh thất bại";

            alert(
                "Lỗi upload: " +
                error.message
            );

        }
        finally{

            uploadBtn.disabled =
                false;

        }

    }
);


/* =========================================
   LOAD IMAGES
========================================= */

async function loadImages(
    roomId
){

    imageList.innerHTML =
        "<p>⏳ Đang tải ảnh...</p>";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "rooms",
                    roomId,
                    "images"
                )
            );


        if(snapshot.empty){

            imageList.innerHTML =
                `
                <div class="empty">
                    Chưa có ảnh phụ.
                </div>
                `;

            return;

        }


        const images = [];


        snapshot.forEach(
            item => {

                images.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        images.sort(
            (a,b) =>
                Number(
                    b.createdAt?.seconds || 0
                )
                -
                Number(
                    a.createdAt?.seconds || 0
                )
        );


        imageList.innerHTML =
            "";


        images.forEach(
            image => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "photo" +
                    (
                        image.isCover
                        ?
                        " is-cover"
                        :
                        ""
                    );


                div.innerHTML = `

                    <img
                        src="${escapeHtml(image.url)}"
                        alt="Ảnh phòng">

                    <div class="photo-info">

                        ${
                            image.isCover
                            ?
                            `
                            <div class="cover-badge">
                                ⭐ Ảnh đại diện
                            </div>
                            `
                            :
                            ""
                        }

                        <div class="photo-id">

                            ID:
                            ${escapeHtml(
                                image.imageId
                            )}

                        </div>


                        ${
                            image.isCover
                            ?
                            ""
                            :
                            `
                            <button
                                type="button"
                                class="success"
                                data-cover-id="${image.id}">
                                ⭐ Đặt làm ảnh đại diện
                            </button>
                            `
                        }


                        <button
                            type="button"
                            class="delete"
                            data-image-id="${image.id}">
                            🗑️ Xóa ảnh
                        </button>

                    </div>

                `;


                const img =
                    div.querySelector(
                        "img"
                    );


                img.addEventListener(
                    "click",
                    function(){

                        openLightbox(
                            image.url
                        );

                    }
                );


                const coverBtn =
                    div.querySelector(
                        "[data-cover-id]"
                    );


                if(coverBtn){

                    coverBtn.addEventListener(
                        "click",
                        function(){

                            setCoverImage(
                                roomId,
                                this.dataset.coverId
                            );

                        }
                    );

                }


                const deleteBtn =
                    div.querySelector(
                        "[data-image-id]"
                    );


                deleteBtn.addEventListener(
                    "click",
                    function(){

                        deleteImage(
                            roomId,
                            this.dataset.imageId
                        );

                    }
                );


                imageList.appendChild(
                    div
                );

            }
        );

    }
    catch(error){

        imageList.innerHTML =
            `
            <div class="empty">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =========================================
   SET COVER IMAGE
========================================= */

async function setCoverImage(
    roomId,
    selectedImageId
){

    try{

        const imagesSnapshot =
            await getDocs(
                collection(
                    db,
                    "rooms",
                    roomId,
                    "images"
                )
            );


        let selectedImage =
            null;


        for(
            const item of imagesSnapshot.docs
        ){

            if(
                item.id ===
                selectedImageId
            ){

                selectedImage = {
                    id:item.id,
                    ...item.data()
                };

                break;

            }

        }


        if(!selectedImage){

            throw new Error(
                "Không tìm thấy ảnh"
            );

        }


        for(
            const item of imagesSnapshot.docs
        ){

            await updateDoc(
                doc(
                    db,
                    "rooms",
                    roomId,
                    "images",
                    item.id
                ),
                {
                    isCover:
                        item.id ===
                        selectedImageId
                }
            );

        }


        await updateDoc(
            doc(
                db,
                "rooms",
                roomId
            ),
            {

                image:
                    selectedImage.url,

                imagePublicId:
                    selectedImage.publicId || ""

            }
        );


        alert(
            "✅ Đã đổi ảnh đại diện phòng"
        );


        await loadImages(
            roomId
        );


        await loadRooms();

    }
    catch(error){

        alert(
            "❌ Không thể đặt ảnh đại diện: " +
            error.message
        );

    }

}


/* =========================================
   DELETE IMAGE
========================================= */

async function deleteImage(
    roomId,
    imageDocumentId
){

    if(
        !confirm(
            "Xóa ảnh này khỏi danh sách?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "rooms",
                roomId,
                "images",
                imageDocumentId
            )
        );


        await loadImages(
            roomId
        );

    }
    catch(error){

        alert(
            "❌ Không thể xóa ảnh: " +
            error.message
        );

    }

}


/* =========================================
   LIGHTBOX
========================================= */

const lightbox =
    document.getElementById(
        "lightbox"
    );

const zoomImage =
    document.getElementById(
        "zoomImage"
    );

const zoomPercent =
    document.getElementById(
        "zoomPercent"
    );


let scale = 1;

let posX = 0;

let posY = 0;

let dragging = false;

let startX = 0;

let startY = 0;


function updateZoom(){

    zoomImage.style.transform =
        `translate(${posX}px,${posY}px) scale(${scale})`;


    zoomPercent.innerText =
        Math.round(
            scale * 100
        ) + "%";

}


function openLightbox(
    url
){

    zoomImage.src =
        url;

    scale = 1;

    posX = 0;

    posY = 0;

    updateZoom();

    lightbox.classList.add(
        "show"
    );

}


function closeLightbox(){

    lightbox.classList.remove(
        "show"
    );

    zoomImage.src =
        "";

}


document
.getElementById("closeBtn")
.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    function(e){

        if(
            e.target === lightbox ||
            e.target.classList.contains(
                "zoom-area"
            )
        ){

            closeLightbox();

        }

    }
);


document
.getElementById("zoomIn")
.addEventListener(
    "click",
    function(){

        scale =
            Math.min(
                scale + .25,
                5
            );

        updateZoom();

    }
);


document
.getElementById("zoomOut")
.addEventListener(
    "click",
    function(){

        scale =
            Math.max(
                scale - .25,
                .5
            );


        if(scale === 1){

            posX = 0;
            posY = 0;

        }


        updateZoom();

    }
);


document
.getElementById("zoomReset")
.addEventListener(
    "click",
    function(){

        scale = 1;

        posX = 0;

        posY = 0;

        updateZoom();

    }
);


zoomPercent.addEventListener(
    "click",
    function(){

        scale = 1;

        posX = 0;

        posY = 0;

        updateZoom();

    }
);


zoomImage.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();


        if(e.deltaY < 0){

            scale =
                Math.min(
                    scale + .15,
                    5
                );

        }
        else{

            scale =
                Math.max(
                    scale - .15,
                    .5
                );

        }


        if(scale === 1){

            posX = 0;
            posY = 0;

        }


        updateZoom();

    },
    {
        passive:false
    }
);


zoomImage.addEventListener(
    "mousedown",
    function(e){

        if(scale <= 1){

            return;

        }


        dragging = true;

        zoomImage.classList.add(
            "dragging"
        );


        startX =
            e.clientX - posX;

        startY =
            e.clientY - posY;

    }
);


window.addEventListener(
    "mousemove",
    function(e){

        if(!dragging){

            return;

        }


        posX =
            e.clientX - startX;

        posY =
            e.clientY - startY;


        updateZoom();

    }
);


window.addEventListener(
    "mouseup",
    function(){

        dragging = false;

        zoomImage.classList.remove(
            "dragging"
        );

    }
);


document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key ===
            "Escape"
        ){

            closeLightbox();

        }

    }
);


/* =========================================
   TAB
========================================= */

const adminTabs =
    document.querySelectorAll(
        ".admin-tab"
    );

const adminPanels =
    document.querySelectorAll(
        ".admin-panel"
    );


adminTabs.forEach(
    tab => {

        tab.addEventListener(
            "click",
            function(){

                const targetId =
                    this.dataset.tab;


                adminTabs.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                adminPanels.forEach(
                    panel =>
                        panel.classList.remove(
                            "active"
                        )
                );


                this.classList.add(
                    "active"
                );


                const target =
                    document.getElementById(
                        targetId
                    );


                if(target){

                    target.classList.add(
                        "active"
                    );

                }

            }
        );

    }
);
